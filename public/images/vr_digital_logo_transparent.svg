<svg width="980" height="240" viewBox="0 0 980 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#1e5a8f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a35a"/>
      <stop offset="50%" stop-color="#f0d998"/>
      <stop offset="100%" stop-color="#c9a35a"/>
    </linearGradient>
  </defs>

  <!-- Icon: globe with orbiting ring -->
  <g transform="translate(115,120)">
    <circle r="58" fill="url(#globeGrad)"/>
    <g stroke="#ffffff" stroke-opacity="0.35" fill="none" stroke-width="1.5">
      <ellipse rx="58" ry="20"/>
      <ellipse rx="58" ry="20" transform="rotate(60)"/>
      <ellipse rx="58" ry="20" transform="rotate(120)"/>
      <line x1="-58" y1="0" x2="58" y2="0"/>
    </g>
    <ellipse rx="76" ry="27" fill="none" stroke="url(#ringGrad)" stroke-width="4" transform="rotate(-18)"/>
    <!-- VR letters on the globe -->
    <text x="0" y="10" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">VR</text>
  </g>

  <!-- Wordmark -->
  <text x="230" y="108" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="1">
    VR DIGITAL <tspan fill="#f0d998">&amp;</tspan> CORPORATE HUB
  </text>
  <text x="232" y="142" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#cfcfcf" letter-spacing="2">
    EMPOWERING THE DIGITAL FUTURE
  </text>
</svg>
