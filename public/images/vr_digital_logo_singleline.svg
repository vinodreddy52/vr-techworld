<svg width="460" height="130" viewBox="0 0 460 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="globeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#1e5a8f"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a35a"/>
      <stop offset="50%" stop-color="#f0d998"/>
      <stop offset="100%" stop-color="#c9a35a"/>
    </linearGradient>
  </defs>

  <!-- Icon: globe with orbiting ring -->
  <g transform="translate(58,65)">
    <circle r="42" fill="url(#globeGrad)"/>
    <g stroke="#ffffff" stroke-opacity="0.35" fill="none" stroke-width="1.3">
      <ellipse rx="42" ry="14"/>
      <ellipse rx="42" ry="14" transform="rotate(60)"/>
      <ellipse rx="42" ry="14" transform="rotate(120)"/>
      <line x1="-42" y1="0" x2="42" y2="0"/>
    </g>
    <ellipse rx="55" ry="19" fill="none" stroke="url(#ringGrad)" stroke-width="3.2" transform="rotate(-18)"/>
    <text x="0" y="8" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle">VR</text>
  </g>

  <!-- Wordmark: single line title, caption directly below -->
  <text x="112" y="60" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#ffffff">
    VR DIGITAL <tspan fill="#f0d998">&amp;</tspan> CORPORATE HUB
  </text>
  <text x="113" y="82" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#cfcfcf" letter-spacing="1">
    EMPOWERING THE DIGITAL FUTURE
  </text>
</svg>
